repositories {
	maven { url = "https://maven.cil.li/" }
	maven {
		name = "chickenbones"
		url = "https://chickenbones.net/maven/"
	}
    maven {
        url "https://cursemaven.com"
    }
    maven { url = "https://teamopenindustry.cc/maven" }
}

sourceSets {
	main {
		java {
			srcDir "ImmersiveRailroadingIntegration/src/main/java"
		}
	}
}

dependencies {
	//Essential libs for OpenComputers
	implementation 'com.typesafe:config:1.4.3'
	implementation 'org.scala-lang:scala-library:2.11.11'

	modImplementation "curse.maven:Railcraft-51195:2299713"
	modImplementation "curse.maven:ImmersiveEngineering-231951:2299020"
	modImplementation "li.cil.oc:OpenComputers:MC1.7.10-1.7.+:api"
	//modImplementation "li.cil.oc:OpenComputers:MC1.7.10-1.7.+"
	modImplementation "codechicken:CodeChickenLib:1.7.10-1.1.3.140:dev"
	modImplementation "codechicken:CodeChickenCore:1.7.10-1.0.7.47:dev"
	modImplementation "curse.maven:ComputerCraft-67504:2269339"
	modImplementation "trackapi:TrackAPI:1.7.10-forge-1.3"
}
